<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Control de Grupos y Préstamos</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Panel administrativo</p>
          <h1>Grupos y Préstamos</h1>
        </div>
        <button class="btn btn-secondary" id="resetDemoBtn">Cargar ejemplo</button>
      </header>

      <main class="layout">
        <aside class="panel form-panel">
          <h2>Crear grupo</h2>
          <form id="groupForm" class="card-form">
            <label>
              Nombre del grupo
              <input type="text" id="groupName" placeholder="Ej. Grupo Norte" required />
            </label>
            <button type="submit" class="btn btn-primary">Guardar grupo</button>
          </form>

          <h2>Registrar persona</h2>
          <form id="personForm" class="card-form">
            <label>
              Grupo
              <select id="personGroupSelect" required></select>
            </label>
            <label>
              Nombre completo
              <input type="text" id="personName" placeholder="Ej. Juan Pérez" required />
            </label>
            <div class="two-columns">
              <label>
                Monto prestado
                <input type="number" id="loanAmount" min="1" step="0.01" placeholder="10000" required />
              </label>
              <label>
                Interés total
                <input type="number" id="interestAmount" min="0" step="0.01" placeholder="2000" />
              </label>
            </div>
            <label>
              Fecha de entrega
              <input type="date" id="grantDate" required />
            </label>
            <button type="submit" class="btn btn-primary">Agregar préstamo</button>
          </form>
        </aside>

        <section class="content">
          <div class="summary-grid" id="summaryGrid"></div>

          <div class="panel">
            <div class="panel-header">
              <h2>Préstamos por grupo</h2>
            </div>
            <div id="groupsContainer" class="groups-container"></div>
          </div>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
